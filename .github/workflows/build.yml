name: Build

# Builds the VSIX and runs the unit tests on every push and pull request.
# Pushing a tag such as "v1.4.0" also publishes the VSIX to the Visual Studio Marketplace,
# which needs a "VS_MARKETPLACE_PAT" secret (Azure DevOps personal access token with the
# Marketplace > Manage scope, from the account of the TiagoGOliveira publisher), then creates
# the GitHub release of the tag with the VSIX and the notes of that version in CHANGELOG.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # gh release create

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild FolderGitStatus.slnx -restore -p:Configuration=Release -v:minimal

      - name: Test
        run: dotnet test tests/FolderGitStatus.Tests/FolderGitStatus.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$manifest = Get-Content src/FolderGitStatus/source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          if ($tag -ne $version) { throw "Tag $tag does not match the manifest version $version" }

      - uses: actions/upload-artifact@v4
        with:
          name: FolderGitStatus-vsix
          path: src/FolderGitStatus/bin/Release/net48/FolderGitStatus.vsix

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/FolderGitStatus.Tests/TestResults/*.trx

      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) { throw 'The VS_MARKETPLACE_PAT secret is not set' }
          $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe |
            Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          & $publisher.FullName publish `
            -payload src/FolderGitStatus/bin/Release/net48/FolderGitStatus.vsix `
            -publishManifest publishManifest.json `
            -personalAccessToken $env:VS_MARKETPLACE_PAT `
            -ignoreWarnings "VSIXValidatorWarning01,VSIXValidatorWarning02"
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed ($LASTEXITCODE)" }

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          ./.github/release-notes.ps1 -Version $tag.TrimStart('v') | Set-Content release-notes.md -Encoding utf8
          $vsix = 'src/FolderGitStatus/bin/Release/net48/FolderGitStatus.vsix'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-run of the same tag: refresh the notes and the VSIX.
            gh release edit $tag --notes-file release-notes.md
            gh release upload $tag $vsix --clobber
          } else {
            gh release create $tag $vsix --title $tag --notes-file release-notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
